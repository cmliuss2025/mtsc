name: Multi-Protocol Proxy Scanner (Runner Engine)

on:
  workflow_dispatch:
    inputs:
      shards_preset:
        description: '分片机器预设选择'
        required: true
        type: choice
        options:
          - '20 台机器 (满血分片并发，默认极速)'
          - '8 台机器 (中速并发，推荐 50 万以上)'
          - '4 台机器 (轻量稳妥，推荐 50 万以下)'
          - 'custom (使用下方自定义输入)'
        default: '20 台机器 (满血分片并发，默认极速)'
      custom_shards:
        description: '自定义分片机器数 (选 custom 时生效，范围 1~20)'
        required: false
        default: '20'
      output_mode:
        description: '输出结果保存模式'
        required: false
        type: choice
        options:
          - 'merge (合并去重: 保活复测历史池并与本次新发现合并)'
          - 'overwrite (覆盖最新: 仅保留本次扫描新结果，丢弃历史存活池)'
        default: 'merge (合并去重: 保活复测历史池并与本次新发现合并)'
      protocol:
        description: '探测协议模式'
        required: false
        type: choice
        options:
          - 'all (全协议: HTTP/HTTPS/SOCKS4/SOCKS5)'
          - 'socks (SOCKS5 + SOCKS4)'
          - 'http (HTTP + HTTPS 网页代理)'
          - 'socks5 (仅 SOCKS5)'
          - 'http_only (仅 HTTP 正向代理)'
          - 'https_only (仅 HTTPS CONNECT 代理)'
          - 'socks4_only (仅 SOCKS4)'
        default: 'all (全协议: HTTP/HTTPS/SOCKS4/SOCKS5)'
      dict_mode:
        description: '弱密码字典模式'
        required: false
        type: choice
        options:
          - 'full (完整 330 组，默认全量爆破)'
          - 'fast (精简高频: 优先免密 + 5 组核心高频弱密，共 6 组)'
          - 'extended (丰富扩展: 包含 25+ 组常用默认口令)'
          - 'none (仅免密探测: 不尝试任何弱口令)'
        default: 'full (完整 330 组，默认全量爆破)'
      fetch_online:
        description: '是否聚合全网公开代理源 (自动拉取数万个公开代理并入待测队列)'
        required: false
        type: boolean
        default: false
      port_preset:
        description: '端口预设选择'
        required: false
        type: choice
        options:
          - 'auto (按探测协议智能匹配常规端口)'
          - '1080 (SOCKS 默认标准单端口)'
          - '1080,1081,1082,10808,10809 (SOCKS 常见高频端口)'
          - '8080 (HTTP 默认代理单端口)'
          - '3128 (Squid 默认代理单端口)'
          - '80,8080,3128,8888,8000,8081 (HTTP/HTTPS 常规 6 端口)'
          - '1080,8080 (SOCKS + HTTP 核心双端口)'
          - '1080,8080,3128,7890,8888,10808 (全协议综合高频 TOP 6)'
          - '80,443,1080,3128,7890,8000,8080,8081,8888,10808 (全协议综合 TOP 10)'
          - '8000-9000 (代理服务常用段 8000~9000)'
          - '1-10000 (常用前 10000 端口)'
          - '1-65535 (全端口 1~65535)'
          - 'custom (使用下方自定义端口，支持逗号或范围)'
        default: 'auto (按探测协议智能匹配常规端口)'
      custom_ports:
        description: '自定义端口 (支持单个端口、逗号分隔、或范围如 1-65535、8000-8080)'
        required: false
        default: '1080'
      workers:
        description: '每台机器并发 Goroutine 数 (默认 3000，兼顾速度与防风控)'
        required: false
        default: '3000'
      timeout:
        description: '超时时间 (默认 2s 极速防风控过滤)'
        required: false
        default: '2s'
      limit:
        description: '单台机器最大扫描数量 (0 为扫描全部)'
        required: false
        default: '0'
      shuffle:
        description: '随机打散目标 (防防火墙与蜜罐连续告警)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.calc-matrix.outputs.matrix }}
      total_shards: ${{ steps.calc-matrix.outputs.total_shards }}

    steps:
      - name: Calculate Shard Matrix
        id: calc-matrix
        env:
          SHARDS_PRESET: ${{ github.event.inputs.shards_preset || '20' }}
          CUSTOM_SHARDS: ${{ github.event.inputs.custom_shards || '20' }}
        run: |
          python3 - <<'EOF'
          import json
          import os

          preset = os.getenv("SHARDS_PRESET", "20")
          custom = os.getenv("CUSTOM_SHARDS", "20")

          if "20" in preset:
              shards = 20
          elif "8" in preset:
              shards = 8
          elif "4" in preset:
              shards = 4
          elif "custom" in preset:
              try:
                  shards = int(custom)
              except ValueError:
                  shards = 20
          else:
              shards = 20

          shards = max(1, min(20, shards))

          shard_list = list(range(shards))
          print(f"[*] 选定分片数量: {shards} 台机器")
          print(f"[*] 分片矩阵: {shard_list}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(shard_list)}\n")
              f.write(f"total_shards={shards}\n")
          EOF

  expand:
    needs: generate-matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fetch Private Repository Asset (if configured)
        env:
          MY_PAT: ${{ secrets.MY_PAT }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
        run: |
          if [ -n "$MY_PAT" ] && [ -n "$PRIVATE_REPO" ]; then
            echo "[*] 检测到跨仓密钥配置，正在从私有仓库 ${PRIVATE_REPO} 获取 ip.txt..."
            git clone --depth 1 "https://${MY_PAT}@github.com/${PRIVATE_REPO}.git" private_vault
            if [ -f private_vault/ip.txt ]; then
              cp private_vault/ip.txt ./ip.txt
              echo "[+] 成功拉取私有仓库 ip.txt"
            fi
            rm -rf private_vault
          else
            echo "[*] 本地仓库模式，使用本地 ip.txt"
          fi

      - name: Expand IP ranges
        env:
          PORT_PRESET: ${{ github.event.inputs.port_preset || 'auto (按探测协议智能匹配常规端口)' }}
          CUSTOM_PORTS: ${{ github.event.inputs.custom_ports || '1080' }}
          PROTOCOL: ${{ github.event.inputs.protocol || 'all' }}
          FETCH_ONLINE: ${{ github.event.inputs.fetch_online || 'false' }}
        run: |
          python3 - <<'EOF'
          import ipaddress
          import os
          import sys

          input_file = "ip.txt"
          output_file = "ip_list.txt"

          preset = os.getenv("PORT_PRESET", "auto")
          custom = os.getenv("CUSTOM_PORTS", "1080")
          proto = os.getenv("PROTOCOL", "all").lower()

          if "custom" in preset:
              raw_ports = custom
          elif preset.startswith("auto"):
              if "socks" in proto and "http" not in proto:
                  raw_ports = "1080,1081,1082,10808,10809"
              elif "http" in proto and "socks" not in proto:
                  raw_ports = "80,443,8080,8443,3128,7890,8000,8081,8888,8889"
              else:
                  raw_ports = "80,443,1080,3128,7890,8000,8080,8081,8443,8888,10808"
          else:
              raw_ports = preset.split()[0]

          ports = []
          for token in raw_ports.replace("，", ",").split(","):
              token = token.strip()
              if not token:
                  continue
              if "-" in token:
                  parts = token.split("-")
                  if len(parts) == 2:
                      try:
                          s, e = int(parts[0]), int(parts[1])
                          if 1 <= s <= e <= 65535:
                              ports.extend([str(p) for p in range(s, e + 1)])
                      except ValueError:
                          pass
              else:
                  try:
                      p = int(token)
                      if 1 <= p <= 65535:
                          ports.append(str(p))
                  except ValueError:
                      pass

          if not ports:
              ports = ["1080"]

          if len(ports) > 10:
              print(f"[*] 正在为目标绑定端口: 共 {len(ports)} 个端口 (从 {ports[0]} 到 {ports[-1]})")
          else:
              print(f"[*] 正在为目标绑定端口: {ports}")

          total_written = 0
          valid_rules = 0
          skipped_rules = 0
          seen = set()

          with open(output_file, "w", encoding="utf-8") as fout:
              if os.path.exists(input_file):
                  with open(input_file, "r", encoding="utf-8") as fin:
                      for line_num, raw in enumerate(fin, 1):
                          line = raw.strip()
                          if not line or line.startswith("#"):
                              continue
                          if "#" in line:
                              line = line.split("#", 1)[0].strip()
                          if not line:
                              continue

                          clean_target = line
                          if "://" in clean_target:
                              clean_target = clean_target.split("://", 1)[1]

                          host_part = clean_target.split("@")[-1] if "@" in clean_target else clean_target
                          if ":" in host_part:
                              parts = host_part.split(":")
                              if len(parts) == 2 and parts[1].isdigit():
                                  if line not in seen:
                                      seen.add(line)
                                      fout.write(line + "\n")
                                      total_written += 1
                                  valid_rules += 1
                                  continue

                          if "-" in line:
                              parts = [p.strip() for p in line.split("-") if p.strip()]
                              if len(parts) == 2:
                                  try:
                                      start_ip = ipaddress.IPv4Address(parts[0])
                                      if "." not in parts[1]:
                                          prefix = ".".join(parts[0].split(".")[:3])
                                          end_ip = ipaddress.IPv4Address(f"{prefix}.{parts[1]}")
                                      else:
                                          end_ip = ipaddress.IPv4Address(parts[1])

                                      if int(start_ip) > int(end_ip):
                                          start_ip, end_ip = end_ip, start_ip

                                      range_count = int(end_ip) - int(start_ip) + 1
                                      if range_count > 5000000:
                                          skipped_rules += 1
                                          print(f"⚠️ Line {line_num}: {range_count} IPs, skipping (too large, max 5,000,000)")
                                          continue

                                      for int_ip in range(int(start_ip), int(end_ip) + 1):
                                          ip_str = str(ipaddress.IPv4Address(int_ip))
                                          for port in ports:
                                              target = f"{ip_str}:{port}"
                                              if target not in seen:
                                                  seen.add(target)
                                                  fout.write(target + "\n")
                                                  total_written += 1

                                      valid_rules += 1
                                      continue
                                  except ValueError:
                                      skipped_rules += 1
                                      print(f"❌ Line {line_num}: invalid IP range format", file=sys.stderr)
                                      continue

                          try:
                              network = ipaddress.ip_network(line, strict=False)
                              count = network.num_addresses

                              if count > 5000000:
                                  skipped_rules += 1
                                  print(f"⚠️ Line {line_num}: {count} addresses, skipping (too large, max 5,000,000)")
                                  continue

                              if count == 1:
                                  hosts = [network.network_address]
                              else:
                                  hosts = network.hosts()

                              for ip in hosts:
                                  ip_str = str(ip)
                                  for port in ports:
                                      target = f"{ip_str}:{port}"
                                      if target not in seen:
                                          seen.add(target)
                                          fout.write(target + "\n")
                                          total_written += 1

                              valid_rules += 1

                          except ValueError:
                              skipped_rules += 1
                              print(f"❌ Line {line_num}: invalid IP/CIDR format", file=sys.stderr)

                  print(f"[*] 规则解析完成 (已脱敏隐藏具体网段): 有效规则 {valid_rules} 条 | 超限/异常跳过 {skipped_rules} 条")

              fetch_online = os.getenv("FETCH_ONLINE", "false").lower() == "true"
              if fetch_online:
                  import urllib.request
                  online_sources = [
                      "https://raw.githubusercontent.com/TheSpeedX/SOCKS-List/master/socks5.txt",
                      "https://raw.githubusercontent.com/TheSpeedX/SOCKS-List/master/http.txt",
                      "https://raw.githubusercontent.com/TheSpeedX/SOCKS-List/master/socks4.txt",
                      "https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt",
                      "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/all.txt",
                      "https://cdn.jsdelivr.net/gh/proxifly/free-proxy-list@main/proxies/all/data.txt",
                  ]
                  print("\n[*] 正在从全网高质量公开代理源拉取代理...")
                  online_added = 0
                  for src in online_sources:
                      try:
                          req = urllib.request.Request(src, headers={"User-Agent": "Mozilla/5.0"})
                          with urllib.request.urlopen(req, timeout=10) as resp:
                              content = resp.read().decode("utf-8", errors="ignore")
                              for raw_line in content.splitlines():
                                  l = raw_line.strip()
                                  if not l or l.startswith("#"):
                                      continue
                                  clean = l
                                  if "://" in clean:
                                      clean = clean.split("://", 1)[1]
                                  if "#" in clean:
                                      clean = clean.split("#", 1)[0].strip()
                                  host_part = clean.split("@")[-1] if "@" in clean else clean
                                  if ":" in host_part:
                                      parts = host_part.split(":")
                                      if len(parts) == 2 and parts[1].isdigit():
                                          if l not in seen:
                                              seen.add(l)
                                              fout.write(l + "\n")
                                              total_written += 1
                                              online_added += 1
                          print(f"✅ 拉取成功: {src}")
                      except Exception as e:
                          print(f"⚠️ 拉取失败 ({src}): {e}")
                  print(f"[*] 公开源拉取完成，共新增 {online_added} 个待测公开代理！")

          print(f"\n📄 Total targets written to {output_file}: {total_written}")
          EOF

      - name: Upload expanded target list
        uses: actions/upload-artifact@v4
        with:
          name: target-ip-list
          path: ip_list.txt
          retention-days: 1

  scan-matrix:
    needs: [generate-matrix, expand]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Fetch Private Repository Scanner (if configured)
        env:
          MY_PAT: ${{ secrets.MY_PAT }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
        run: |
          if [ -n "$MY_PAT" ] && [ -n "$PRIVATE_REPO" ]; then
            echo "[*] 正在从私有仓库 ${PRIVATE_REPO} 获取 multi_scan.go..."
            git clone --depth 1 "https://${MY_PAT}@github.com/${PRIVATE_REPO}.git" private_vault
            if [ -f private_vault/multi_scan.go ]; then
              cp private_vault/multi_scan.go ./multi_scan.go
              echo "[+] 成功拉取 multi_scan.go"
            fi
            rm -rf private_vault
          else
            echo "[*] 本地仓库模式，使用本地 multi_scan.go"
          fi

      - name: Download target list
        uses: actions/download-artifact@v4
        with:
          name: target-ip-list

      - name: Run Multi-Protocol Shard Scanner
        env:
          RAW_PROTO: ${{ github.event.inputs.protocol || 'all' }}
          RAW_DICT: ${{ github.event.inputs.dict_mode || 'full' }}
          IN_SHUFFLE: ${{ github.event.inputs.shuffle }}
          IN_WORKERS: ${{ github.event.inputs.workers || '3000' }}
          IN_TIMEOUT: ${{ github.event.inputs.timeout || '2s' }}
          IN_LIMIT: ${{ github.event.inputs.limit || '0' }}
          SHARD_IDX: ${{ matrix.shard }}
          SHARD_TOT: ${{ needs.generate-matrix.outputs.total_shards }}
        run: |
          ulimit -n 65535 2>/dev/null || true
          PROTO=$(echo "$RAW_PROTO" | awk '{print $1}')
          DICT=$(echo "$RAW_DICT" | awk '{print $1}')
          if [ "$IN_SHUFFLE" = "false" ]; then
            SHUFFLE_ARG="-shuffle=false"
          else
            SHUFFLE_ARG="-shuffle=true"
          fi
          WORKERS_NUM=$(echo "$IN_WORKERS" | tr -cd '0-9')
          [ -z "$WORKERS_NUM" ] && WORKERS_NUM=3000
          LIMIT_NUM=$(echo "$IN_LIMIT" | tr -cd '0-9')
          [ -z "$LIMIT_NUM" ] && LIMIT_NUM=0
          TIMEOUT_CLEAN=$(echo "$IN_TIMEOUT" | tr -cd '0-9a-zA-Z.')
          [ -z "$TIMEOUT_CLEAN" ] && TIMEOUT_CLEAN="2s"

          go run multi_scan.go \
            -input ip_list.txt \
            -output "results_${SHARD_IDX}.txt" \
            -shard-index "$SHARD_IDX" \
            -shard-total "$SHARD_TOT" \
            -proto "$PROTO" \
            -dict "$DICT" \
            -silent \
            "$SHUFFLE_ARG" \
            -workers "$WORKERS_NUM" \
            -timeout "$TIMEOUT_CLEAN" \
            -limit "$LIMIT_NUM"

      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: "shard-${{ matrix.shard }}"
          path: "results_${{ matrix.shard }}.txt"
          retention-days: 1

  merge-and-push:
    needs: [generate-matrix, scan-matrix]
    if: always() && needs.generate-matrix.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Setup Go
        if: needs.scan-matrix.result != 'cancelled' && needs.scan-matrix.result != 'skipped'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download all shard artifacts
        if: needs.scan-matrix.result != 'cancelled' && needs.scan-matrix.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: shards

      - name: Recheck historical pool, merge, deduplicate and push
        if: needs.scan-matrix.result != 'cancelled' && needs.scan-matrix.result != 'skipped'
        env:
          MY_PAT: ${{ secrets.MY_PAT }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          IN_TIMEOUT: ${{ github.event.inputs.timeout || '2s' }}
          RAW_OUTPUT_MODE: ${{ github.event.inputs.output_mode || 'merge' }}
        run: |
          echo "[*] 开始汇总各分片扫描结果..."
          TIMEOUT_CLEAN=$(echo "$IN_TIMEOUT" | tr -cd '0-9a-zA-Z.')
          [ -z "$TIMEOUT_CLEAN" ] && TIMEOUT_CLEAN="2s"
          OUTPUT_MODE=$(echo "$RAW_OUTPUT_MODE" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')
          [ -z "$OUTPUT_MODE" ] && OUTPUT_MODE="merge"
          echo "[*] 输出结果处理模式: $OUTPUT_MODE"

          mkdir -p temp_merge
          : > temp_merge/raw_all.txt
          if [ -d "shards" ]; then
            find shards -type f -name "results_*.txt" -exec cat {} + >> temp_merge/raw_all.txt 2>/dev/null || true
          fi
          grep -v '^\s*$' temp_merge/raw_all.txt | sort -u > temp_merge/new_alive.txt || : > temp_merge/new_alive.txt
          NEW_COUNT=$(wc -l < temp_merge/new_alive.txt | tr -d ' ')
          echo "[*] 本次分片新发现存活代理数 (去重后): $NEW_COUNT"

          CROSS_REPO="false"
          WORK_REPO="."
          SCANNER_SRC="./multi_scan.go"

          if [ -n "$MY_PAT" ] && [ -n "$PRIVATE_REPO" ]; then
            CROSS_REPO="true"
            echo "[*] 跨仓模式：正在同步私有仓库以复测历史代理池..."
            git clone "https://${MY_PAT}@github.com/${PRIVATE_REPO}.git" target_repo
            WORK_REPO="target_repo"
            if [ -f "target_repo/multi_scan.go" ]; then
              SCANNER_SRC="target_repo/multi_scan.go"
            fi
          fi

          if [ "$OUTPUT_MODE" = "overwrite" ]; then
            echo "[*] 选定保存模式: overwrite (覆盖最新) -> 仅保留本次扫描新结果，丢弃历史存活池"
            cp temp_merge/new_alive.txt temp_merge/final_all.txt
            FINAL_COUNT=$NEW_COUNT
            echo "[*] 覆盖后当前总存活代理数: $FINAL_COUNT"
          else
            echo "[*] 选定保存模式: merge (合并去重) -> 正在对历史存活池保活复测并与新结果合并..."
            # 对历史存活代理池进行快速保活复测，自动剔除失效死节点与历史假活
            : > temp_merge/rechecked_old.txt
            if [ -s "${WORK_REPO}/all_results.txt" ] && [ -f "$SCANNER_SRC" ]; then
              OLD_COUNT=$(grep -v '^\s*$' "${WORK_REPO}/all_results.txt" 2>/dev/null | wc -l | tr -d ' ' || echo 0)
              echo "[*] 检测到历史存活池共 ${OLD_COUNT} 条，正在执行保活复测..."
              if go run "$SCANNER_SRC" \
                -input "${WORK_REPO}/all_results.txt" \
                -output "temp_merge/rechecked_old.txt" \
                -recheck \
                -silent \
                -dict none \
                -shuffle=false \
                -workers 1000 \
                -timeout "$TIMEOUT_CLEAN"; then
                KEPT_COUNT=$(grep -v '^\s*$' temp_merge/rechecked_old.txt 2>/dev/null | wc -l | tr -d ' ' || echo 0)
                echo "[*] 历史代理保活复测完成: 留存真活 ${KEPT_COUNT} / ${OLD_COUNT} 条"
              else
                echo "[!] 复测执行异常，安全回退保留原有历史列表"
                cp "${WORK_REPO}/all_results.txt" temp_merge/rechecked_old.txt
              fi
            fi

            # 合并【本次新发现】+【历史仍存活】并严格去重
            cat temp_merge/new_alive.txt temp_merge/rechecked_old.txt | grep -v '^\s*$' | sort -u > temp_merge/final_all.txt || : > temp_merge/final_all.txt
            FINAL_COUNT=$(wc -l < temp_merge/final_all.txt | tr -d ' ')
            echo "[*] 合并去重后当前总存活代理数: $FINAL_COUNT"
          fi

          HTTP_COUNT=$(grep -c '^http://' temp_merge/final_all.txt || true)
          HTTPS_COUNT=$(grep -c '^https://' temp_merge/final_all.txt || true)
          SOCKS5_COUNT=$(grep -c '^socks5://' temp_merge/final_all.txt || true)
          SOCKS4_COUNT=$(grep -c '^socks4://' temp_merge/final_all.txt || true)
          META_MODE="$OUTPUT_MODE" META_NEW="${NEW_COUNT:-0}" META_OLD="${OLD_COUNT:-0}" META_KEPT="${KEPT_COUNT:-0}" META_FINAL="${FINAL_COUNT:-0}" META_REPO="$WORK_REPO" META_HTTP="${HTTP_COUNT:-0}" META_HTTPS="${HTTPS_COUNT:-0}" META_SOCKS5="${SOCKS5_COUNT:-0}" META_SOCKS4="${SOCKS4_COUNT:-0}" python3 - <<'EOF'
          import json
          import os

          meta = {
              "output_mode": os.getenv("META_MODE", "merge"),
              "new_count": int(os.getenv("META_NEW", "0") or 0),
              "old_count": int(os.getenv("META_OLD", "0") or 0),
              "kept_count": int(os.getenv("META_KEPT", "0") or 0),
              "final_count": int(os.getenv("META_FINAL", "0") or 0),
              "work_repo": os.getenv("META_REPO", "."),
              "http_count": int(os.getenv("META_HTTP", "0") or 0),
              "https_count": int(os.getenv("META_HTTPS", "0") or 0),
              "socks5_count": int(os.getenv("META_SOCKS5", "0") or 0),
              "socks4_count": int(os.getenv("META_SOCKS4", "0") or 0),
          }
          with open("temp_merge/scan_meta.json", "w", encoding="utf-8") as f:
              json.dump(meta, f)
          EOF

          if [ "$FINAL_COUNT" -eq 0 ]; then
            echo "[!] 本次存活总数为 0，触发保护机制：保留原有结果文件不覆盖，跳过提交。"
            exit 0
          fi

          # 统一按协议分流写入目标仓库，确保 5 个文件严格一致且无重复
          cp temp_merge/final_all.txt "${WORK_REPO}/all_results.txt"
          grep '^http://' temp_merge/final_all.txt > "${WORK_REPO}/http_results.txt" || : > "${WORK_REPO}/http_results.txt"
          grep '^https://' temp_merge/final_all.txt > "${WORK_REPO}/https_results.txt" || : > "${WORK_REPO}/https_results.txt"
          grep '^socks5://' temp_merge/final_all.txt > "${WORK_REPO}/socks5_results.txt" || : > "${WORK_REPO}/socks5_results.txt"
          grep '^socks4://' temp_merge/final_all.txt > "${WORK_REPO}/socks4_results.txt" || : > "${WORK_REPO}/socks4_results.txt"

          NOW_UTC=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          cd "$WORK_REPO"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add all_results.txt http_results.txt https_results.txt socks5_results.txt socks4_results.txt

          if ! git diff --staged --quiet; then
            if [ "$CROSS_REPO" = "true" ]; then
              TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            else
              TARGET_BRANCH="${GITHUB_REF#refs/heads/}"
            fi
            git commit -m "Auto-update multi-protocol proxy results (${NOW_UTC}, alive: ${FINAL_COUNT}, mode: ${OUTPUT_MODE}) [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin "$TARGET_BRANCH" 2>/dev/null || true
              if git push origin "$TARGET_BRANCH"; then
                echo "[+] 成功更新并推送代理结果 (总存活: ${FINAL_COUNT})！"
                break
              fi
              echo "[!] Push 遇到并发更新冲突，等待 ${attempt}s 后重试..."
              sleep "$attempt"
            done
          else
            echo "[*] 代理列表无变更，跳过提交。"
          fi

      - name: Sync Gist & Send Telegram Notification
        if: needs.scan-matrix.result != 'cancelled' && needs.scan-matrix.result != 'skipped'
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID || vars.GIST_ID }}
          RAW_PROTO: ${{ github.event.inputs.protocol || 'all' }}
          RAW_DICT: ${{ github.event.inputs.dict_mode || 'full' }}
          SHARD_TOT: ${{ needs.generate-matrix.outputs.total_shards }}
          IN_WORKERS: ${{ github.event.inputs.workers || '3000' }}
          MATRIX_RESULT: ${{ needs.scan-matrix.result }}
        run: |
          python3 - <<'EOF'
          import datetime
          import html
          import json
          import os
          import urllib.error
          import urllib.request

          tg_token = os.getenv("TG_BOT_TOKEN", "").strip()
          tg_chat = os.getenv("TG_CHAT_ID", "").strip()
          gist_token = os.getenv("GIST_TOKEN", "").strip()
          gist_id = os.getenv("GIST_ID", "").strip()
          if "/" in gist_id:
              gist_id = gist_id.rstrip("/").split("/")[-1]

          if not tg_token and not gist_token:
              print("[*] 未配置 Telegram 或 GitHub Gist 凭据，跳过推送通知。")
              raise SystemExit(0)

          meta_path = "temp_merge/scan_meta.json"
          meta = {
              "output_mode": "merge",
              "new_count": 0,
              "old_count": 0,
              "kept_count": 0,
              "final_count": 0,
              "work_repo": ".",
              "http_count": 0,
              "https_count": 0,
              "socks5_count": 0,
              "socks4_count": 0,
          }
          if os.path.exists(meta_path):
              try:
                  with open(meta_path, "r", encoding="utf-8") as f:
                      meta.update(json.load(f))
              except Exception as e:
                  print(f"[!] 读取汇总元数据失败: {e}")

          final_count = int(meta.get("final_count", 0))
          new_count = int(meta.get("new_count", 0))
          old_count = int(meta.get("old_count", 0))
          kept_count = int(meta.get("kept_count", 0))
          output_mode = str(meta.get("output_mode", "merge"))
          work_repo = str(meta.get("work_repo", "."))

          gist_view_url = ""
          gist_raw_url = ""
          created_gist_id = ""

          if gist_token:
              if final_count == 0:
                  print("[*] 本次有效存活代理为 0，自动跳过 Gist 同步 (保留历史备份数据)")
              else:
                  print("[*] 正在同步存活代理至 GitHub Secret Gist (多协议打包备份)...")
                  result_names = [
                      "all_results.txt",
                      "http_results.txt",
                      "https_results.txt",
                      "socks5_results.txt",
                      "socks4_results.txt",
                  ]
                  files_obj = {}
                  empty_names = []
                  for fname in result_names:
                      fpath = os.path.join(work_repo, fname)
                      content = ""
                      if os.path.exists(fpath):
                          with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()
                      if content.strip():
                          files_obj[fname] = {"content": content}
                      else:
                          empty_names.append(fname)

                  if not files_obj:
                      files_obj["all_results.txt"] = {"content": "# ScamNet 暂无存活代理数据\n"}

                  gh_headers = {
                      "Authorization": f"Bearer {gist_token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "ScamNet-Scanner/1.0",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  }

                  # overwrite 模式下，清理既有 Gist 中本次已为空的旧协议文件
                  if gist_id and output_mode == "overwrite" and empty_names:
                      try:
                          get_req = urllib.request.Request(
                              f"https://api.github.com/gists/{gist_id}",
                              headers=gh_headers,
                              method="GET",
                          )
                          with urllib.request.urlopen(get_req, timeout=10) as resp:
                              existing = json.loads(resp.read().decode("utf-8", errors="ignore"))
                              existing_files = existing.get("files", {}) or {}
                              for ename in empty_names:
                                  if ename in existing_files:
                                      files_obj[ename] = None
                      except Exception:
                          pass

                  now_str = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
                  if gist_id:
                      api_url = f"https://api.github.com/gists/{gist_id}"
                      method = "PATCH"
                      payload = {
                          "description": f"ScamNet Live Proxies (Updated: {now_str})",
                          "files": files_obj,
                      }
                  else:
                      api_url = "https://api.github.com/gists"
                      method = "POST"
                      payload = {
                          "description": f"ScamNet Live Proxies (Created: {now_str})",
                          "public": False,
                          "files": files_obj,
                      }

                  try:
                      req = urllib.request.Request(
                          api_url,
                          data=json.dumps(payload).encode("utf-8"),
                          headers=gh_headers,
                          method=method,
                      )
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          res_obj = json.loads(resp.read().decode("utf-8", errors="ignore"))
                          gist_view_url = res_obj.get("html_url", "") or ""
                          res_files = res_obj.get("files", {}) or {}
                          if "all_results.txt" in res_files:
                              gist_raw_url = res_files["all_results.txt"].get("raw_url", "") or ""
                          else:
                              for fmeta in res_files.values():
                                  gist_raw_url = (fmeta or {}).get("raw_url", "") or ""
                                  if gist_raw_url:
                                      break
                          if not gist_id and res_obj.get("id"):
                              created_gist_id = res_obj["id"]
                          # 脱敏：不在公开 Runner 日志打印 Secret Gist 明文链接
                          print("[+] GitHub Secret Gist 同步成功！")
                  except urllib.error.HTTPError as e:
                      err_body = e.read().decode("utf-8", errors="ignore")[:300]
                      print(f"[!] Gist 同步失败: HTTP {e.code} {err_body}")
                  except Exception as e:
                      print(f"[!] Gist 同步异常: {e}")

          if tg_token and tg_chat:
              print("[*] 正在发送 Telegram 机器人通知卡片...")
              proto_val = (os.getenv("RAW_PROTO", "all").split() or ["all"])[0]
              dict_val = (os.getenv("RAW_DICT", "full").split() or ["full"])[0]
              shards_val = os.getenv("SHARD_TOT", "1")
              workers_val = "".join(c for c in os.getenv("IN_WORKERS", "3000") if c.isdigit()) or "3000"
              matrix_res = os.getenv("MATRIX_RESULT", "success")

              status_text = "✅ 云端扫描与汇总完成" if matrix_res == "success" else f"⚠️ 扫描结束 (矩阵状态: {html.escape(matrix_res)})"
              mode_label = "merge (合并去重)" if output_mode == "merge" else "overwrite (覆盖最新)"

              recheck_line = ""
              if output_mode == "merge" and old_count > 0:
                  recheck_line = f"\n♻️ <b>历史保活:</b> 留存 {kept_count} / {old_count} 条"

              gist_section = ""
              if gist_view_url:
                  gist_section = (
                      f'\n━━━━━━━━━━━━━━━━━━━\n🔗 <b>Gist 私密同步:</b> '
                      f'<a href="{html.escape(gist_view_url)}">在线查看</a> | '
                      f'<a href="{html.escape(gist_raw_url)}">Raw 直链</a>'
                  )
                  if created_gist_id:
                      gist_section += (
                          f'\n💡 <i>首次新建 Secret Gist，ID 为 <code>{html.escape(created_gist_id)}</code>'
                          f'（可写入 Secret <code>GIST_ID</code> 以便后续覆盖更新）</i>'
                      )
              elif gist_token and final_count == 0:
                  if gist_id:
                      hist_url = f"https://gist.github.com/{gist_id}"
                      gist_section = (
                          f'\n━━━━━━━━━━━━━━━━━━━\n🔗 <b>Gist 备份:</b> '
                          f'<a href="{html.escape(hist_url)}">历史备份</a> (本次无存活未覆盖)'
                      )
                  else:
                      gist_section = "\n━━━━━━━━━━━━━━━━━━━\n🔗 <b>Gist 备份:</b> 本次无存活，已跳过推送"

              msg = (
                  f"🚀 <b>ScamNet 云端扫描任务报告</b>\n"
                  f"━━━━━━━━━━━━━━━━━━━\n"
                  f"📊 <b>任务状态:</b> {status_text}\n"
                  f"💾 <b>保存模式:</b> {html.escape(mode_label)}\n"
                  f"🎯 <b>本次新发现:</b> {new_count} 个 | <b>总存活代理:</b> {final_count} 个"
                  f"{recheck_line}\n"
                  f"📌 <b>协议分布:</b> HTTP: {meta.get('http_count', 0)} | HTTPS: {meta.get('https_count', 0)} | SOCKS5: {meta.get('socks5_count', 0)} | SOCKS4: {meta.get('socks4_count', 0)}\n"
                  f"🖥 <b>矩阵分片:</b> {html.escape(shards_val)} 台机器 (并发: {html.escape(workers_val)} | 协议: {html.escape(proto_val)} | 字典: {html.escape(dict_val)})"
                  f"{gist_section}"
              )

              tg_payload = json.dumps({
                  "chat_id": tg_chat,
                  "text": msg,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": False,
              }).encode("utf-8")

              try:
                  tg_req = urllib.request.Request(
                      f"https://api.telegram.org/bot{tg_token}/sendMessage",
                      data=tg_payload,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(tg_req, timeout=10) as resp:
                      if 200 <= resp.status < 300:
                          print("[+] Telegram 通知已成功发送！")
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode("utf-8", errors="ignore")[:300]
                  print(f"[!] Telegram 通知发送失败: HTTP {e.code} {err_body}")
              except Exception as e:
                  print(f"[!] Telegram 通知发送异常: {type(e).__name__}")
          EOF

      - name: Destroy temporary artifacts and purge old runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] 安全防泄露清理：正在彻底销毁本次运行产生的所有中转 Artifacts..."
          CURRENT_RUN_ID="${{ github.run_id }}"
          TARGET_REPO="${GITHUB_REPOSITORY}"

          # 1. 物理删除当前 Run 产生的所有中转工件（彻底消除公开仓库 Actions 页面泄露风险）
          gh api "/repos/${TARGET_REPO}/actions/runs/${CURRENT_RUN_ID}/artifacts" --jq '.artifacts[].id' 2>/dev/null | while read -r art_id; do
            if [ -n "$art_id" ]; then
              echo "[-] 正在销毁工件 ID: $art_id"
              gh api -X DELETE "/repos/${TARGET_REPO}/actions/artifacts/$art_id" 2>/dev/null || true
            fi
          done
          echo "[+] 所有中转 Artifacts 已彻底物理销毁，外部访客无法查看或下载任何扫描结果！"

          # 2. 清理旧的 workflow 运行记录，仅保留最新 1 条
          echo "[*] 清理旧的 workflow 运行记录，仅保留最新 1 条..."
          gh run list --repo "$TARGET_REPO" --limit 100 --json databaseId --jq '.[] | select(.databaseId != ('"$CURRENT_RUN_ID"')) | .databaseId' 2>/dev/null | while read -r id; do
            [ -n "$id" ] && gh run delete --repo "$TARGET_REPO" "$id" 2>/dev/null || true
          done
          echo "[+] 清理完成！"
